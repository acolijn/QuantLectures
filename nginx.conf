server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # User documentation: static VitePress pages with clean URLs
    # (/docs/teachers/faq → faq.html). Must not fall back to the app's
    # index.html, or a mistyped docs link would open the app instead.
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location = /docs {
        return 301 /docs/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
